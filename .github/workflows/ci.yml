name: CI

on:
  push:
    branches:
      - main
      - "stage-*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        run: go test -race -count=1 ./...

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.27.x"
          repo-checkout: false

  css:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAILWIND_VERSION: "4.3.3"
      TAILWIND_SHA256: "dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the pinned Tailwind CSS
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64"
          actual="$(sha256sum tailwindcss | cut -d ' ' -f 1)"
          if [ "${actual}" != "${TAILWIND_SHA256}" ]; then
            echo "tailwindcss ${TAILWIND_VERSION} has the SHA-256 ${actual}, the pinned one is ${TAILWIND_SHA256}"
            exit 1
          fi
          chmod +x tailwindcss
      - name: Build the stylesheet
        run: make css TAILWIND=./tailwindcss
      - name: Compare the stylesheet with the committed one
        run: git diff --exit-code -- internal/adminui/static/admin.css

  integration-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: limb
          POSTGRES_PASSWORD: limb
          POSTGRES_DB: limb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U limb -d limb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LIMB_TEST_POSTGRES_DSN: postgres://limb:limb@localhost:5432/limb_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Test against PostgreSQL ${{ matrix.postgres }}
        shell: bash
        run: |
          go test -race -count=1 -v . ./sqlstore/... 2>&1 | tee integration.log
          if grep -E -e '--- SKIP' integration.log; then
            echo "integration tests must not be skipped"
            exit 1
          fi

  integration-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.4", "9"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: limb
          MYSQL_PASSWORD: limb
          MYSQL_DATABASE: limb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ulimb -plimb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      LIMB_TEST_MYSQL_DSN: limb:limb@tcp(127.0.0.1:3306)/limb_test?parseTime=true&loc=UTC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Test against MySQL ${{ matrix.mysql }}
        shell: bash
        run: |
          go test -race -count=1 -v . ./sqlstore/... 2>&1 | tee integration.log
          if grep -E -e '--- SKIP' integration.log; then
            echo "integration tests must not be skipped"
            exit 1
          fi

  integration-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mariadb: ["10.11", "11.8"]
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: limb
          MARIADB_PASSWORD: limb
          MARIADB_DATABASE: limb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      LIMB_TEST_MARIADB_DSN: limb:limb@tcp(127.0.0.1:3306)/limb_test?parseTime=true&loc=UTC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Test against MariaDB ${{ matrix.mariadb }}
        shell: bash
        run: |
          go test -race -count=1 -v . ./sqlstore/... 2>&1 | tee integration.log
          if grep -E -e '--- SKIP' integration.log; then
            echo "integration tests must not be skipped"
            exit 1
          fi

  integration-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gvenzl/oracle-xe:21-slim-faststart
            pdb: XEPDB1
          - image: gvenzl/oracle-free:23-slim-faststart
            pdb: FREEPDB1
    services:
      oracle:
        image: ${{ matrix.image }}
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: limb
          APP_USER_PASSWORD: limbtest
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      LIMB_TEST_ORACLE_DSN: oracle://limb:limbtest@127.0.0.1:1521/${{ matrix.pdb }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Test against ${{ matrix.image }}
        shell: bash
        run: |
          go test -race -count=1 -p 1 -v . ./sqlstore/... 2>&1 | tee integration.log
          if grep -E -e '--- SKIP' integration.log; then
            echo "integration tests must not be skipped"
            exit 1
          fi
